name: Agent Native MCP scope challenge
on:
  pull_request:
    paths:
      - 'src/mcp-core.ts'
      - 'test/mcp.test.mjs'
      - '.github/workflows/mcp-scope-challenge-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: node --test test/mcp.test.mjs
